<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<ul th:fragment="sidebar" class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion"
    id="accordionSidebar">

    <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/}">
        <div class="sidebar-brand-icon rotate-n-15">
            <i class="fas fa-satellite-dish"></i>
        </div>
        <div class="sidebar-brand-text mx-3">Tech Radar</div>
    </a>

    <hr class="sidebar-divider my-0">

    <li class="nav-item" th:classappend="${menu == 'dashboard'} ? 'active'">
        <a class="nav-link" th:href="@{/}">
            <i class="fas fa-fw fa-tachometer-alt"></i>
            <span>대시보드</span></a>
    </li>

    <hr class="sidebar-divider">
    <div class="sidebar-heading">크롤링</div>

    <li class="nav-item" th:classappend="${menu == 'articles'} ? 'active'">
        <a class="nav-link" th:href="@{/articles}">
            <i class="fas fa-fw fa-newspaper"></i>
            <span>기사</span></a>
    </li>
    <li class="nav-item" th:classappend="${menu == 'keywords'} ? 'active'">
        <a class="nav-link" th:href="@{/keywords}">
            <i class="fas fa-fw fa-tags"></i>
            <span>키워드</span></a>
    </li>
    <li class="nav-item" th:classappend="${menu == 'runs'} ? 'active'">
        <a class="nav-link" th:href="@{/runs}">
            <i class="fas fa-fw fa-history"></i>
            <span>이력</span></a>
    </li>
    <li class="nav-item" th:classappend="${menu == 'sources'} ? 'active'">
        <a class="nav-link" th:href="@{/sources}">
            <i class="fas fa-fw fa-rss"></i>
            <span>소스</span></a>
    </li>

    <hr class="sidebar-divider d-none d-md-block">

    <div class="text-center d-none d-md-inline">
        <button class="rounded-circle border-0" id="sidebarToggle"></button>
    </div>
</ul>
</body>
</html>
